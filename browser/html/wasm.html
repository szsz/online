<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
    <title>Online</title>
    <style>
        html,
        body,
        iframe {
            margin: 0px;
            padding: 0px;
            border: none;
        }
        #upload-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            z-index: 10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #upload-overlay.hidden { display: none; }
        #upload-overlay h1 { font-size: 1.5em; margin-bottom: 1em; color: #333; }
        #upload-overlay label {
            display: inline-block;
            padding: 12px 24px;
            background: #0366d6;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
        }
        #upload-overlay label:hover { background: #0256b9; }
        #upload-overlay input[type="file"] { display: none; }
        #upload-overlay .status { margin-top: 1em; color: #666; }
        #upload-overlay .links { margin-top: 1.5em; text-align: center; width: 100%; max-width: 500px; }
        #upload-overlay .links a {
            display: block;
            margin: 0.5em 0;
            padding: 12px 24px;
            background: #0366d6;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 1em;
            cursor: pointer;
        }
        #upload-overlay .links a:hover { background: #0256b9; }
        #upload-overlay .links a.disabled {
            background: #999;
            cursor: not-allowed;
            pointer-events: none;
        }
        #upload-overlay .share-box { width: 100%; }
        #upload-overlay .share-box label { display: block; margin-bottom: 0.4em; color: #555; font-size: 0.9em; background: none; padding: 0; cursor: default; }
        #upload-overlay .share-row { display: flex; gap: 0; }
        #upload-overlay .share-row input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px 0 0 6px;
            font-size: 0.85em;
            font-family: monospace;
            outline: none;
        }
        #upload-overlay .share-row input[type="text"]:focus { border-color: #0366d6; }
        #upload-overlay .share-row button {
            padding: 10px 16px;
            background: #28a745;
            color: white;
            border: 1px solid #28a745;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            font-size: 0.85em;
            white-space: nowrap;
        }
        #upload-overlay .share-row button:hover { background: #22863a; }
        #upload-overlay .progress-box { width: 100%; margin-top: 0.5em; }
        #upload-overlay .progress-bar {
            width: 100%;
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            overflow: hidden;
        }
        #upload-overlay .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #0366d6;
            border-radius: 3px;
            transition: width 0.3s;
        }
        #upload-overlay .progress-text {
            font-size: 0.8em;
            color: #888;
            margin-top: 0.3em;
        }
        #upload-overlay .name-row {
            display: flex;
            gap: 0;
            margin-bottom: 1em;
            width: 80%;
            max-width: 300px;
        }
        #upload-overlay .name-row input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px 0 0 6px;
            font-size: 0.9em;
            outline: none;
        }
        #upload-overlay .name-row input[type="text"]:focus { border-color: #0366d6; }
        #upload-overlay .name-row button {
            padding: 8px 12px;
            background: #28a745;
            color: white;
            border: 1px solid #28a745;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            font-size: 0.85em;
        }
        #upload-overlay .name-row button:hover { background: #22863a; }
        #upload-overlay .recent-files { width: 80%; max-width: 500px; margin-top: 1.5em; text-align: left; }
        #upload-overlay .recent-files h2 { font-size: 1em; color: #555; margin: 0 0 0.5em 0; }
        #upload-overlay .recent-files ul { list-style: none; padding: 0; margin: 0; }
        #upload-overlay .recent-files li {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; margin: 4px 0;
            background: white; border: 1px solid #ddd; border-radius: 6px;
            cursor: pointer; transition: background 0.15s;
        }
        #upload-overlay .recent-files li:hover { background: #e8f0fe; border-color: #0366d6; }
        #upload-overlay .recent-files .file-name { font-weight: 500; color: #333; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #upload-overlay .recent-files .file-date { font-size: 0.8em; color: #999; margin-left: 1em; white-space: nowrap; }
        #upload-overlay .recent-files .file-remove {
            margin-left: 0.5em; color: #ccc; cursor: pointer; font-size: 1.1em;
            padding: 0 4px; border-radius: 3px;
        }
        #upload-overlay .recent-files .file-remove:hover { color: #e33; background: #fee; }
        #upload-overlay .or-divider { margin: 1.2em 0 0.5em; color: #aaa; font-size: 0.9em; }
    </style>
    <script src="/config.js"></script>
</head>

<body>
    <div id="upload-overlay">
        <h1>Collabora Online (WASM)</h1>
        <div class="name-row" style="border-radius:6px;">
            <input type="text" id="name-input" placeholder="Your name" style="border-radius:6px;" />
        </div>
        <label for="file-input">Choose a document to open</label>
        <input type="file" id="file-input"
            accept=".odt,.ods,.odp,.odg,.docx,.xlsx,.pptx,.doc,.xls,.ppt,.pdf,.txt,.csv,.rtf" />
        <div class="status" id="upload-status">Initializing...</div>
        <div class="progress-box" id="init-progress" style="width:80%;max-width:500px;margin-top:1em;">
            <div class="progress-bar"><div class="progress-bar-fill" id="init-fill" style="width:0%"></div></div>
            <div class="progress-text" id="init-text">Loading...</div>
        </div>
    </div>
    <form id="form" action enctype="multipart/form-data" target="coolframe" method="post" style="display:none;">
        <input name="access_token" value="test" type="hidden" />
    </form>
    <iframe id="coolframe" name="coolframe" style="width:100%;height:100%;position:absolute;" title="Collabora Online">
    </iframe>
    <script>
        // --- Crypto helpers ---

        // Recent files: stored as JSON array in localStorage
        // Each entry: { key: string, name: string, time: number }
        var RECENT_KEY = 'cool-recent-files';
        function getRecentFiles() {
            try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; }
            catch(e) { return []; }
        }
        function saveRecentFile(key, name) {
            var files = getRecentFiles().filter(function(f) { return f.key !== key; });
            files.unshift({ key: key, name: name, time: Date.now() });
            if (files.length > 20) files = files.slice(0, 20);
            localStorage.setItem(RECENT_KEY, JSON.stringify(files));
        }
        function removeRecentFile(key) {
            var files = getRecentFiles().filter(function(f) { return f.key !== key; });
            localStorage.setItem(RECENT_KEY, JSON.stringify(files));
        }

        var _hasHash = window.location.hash && window.location.hash !== '#';

        // Generate encryption key if none provided (deferred if we show recent files)
        if (!_hasHash) {
            var array = new Uint8Array(16);
            crypto.getRandomValues(array);
            var key = Array.from(array, function(b) { return b.toString(16).padStart(2, '0'); }).join('');
            // Don't set hash yet — we'll set it when user picks upload
        }

        var encKey = _hasHash ? window.location.hash.substring(1) : key;
        var fragment = _hasHash ? window.location.hash : '#' + key;

        // Register the crypto Service Worker (encrypts/decrypts /wasm/* at the network layer)
        var swReady = Promise.resolve();
        if ('serviceWorker' in navigator) {
            swReady = navigator.serviceWorker.register('/wasm-crypto-sw.js', { scope: '/' })
                .then(function(reg) {
                    // Wait for the SW to be active and controlling this page
                    var sw = reg.active || reg.installing || reg.waiting;
                    if (navigator.serviceWorker.controller) {
                        navigator.serviceWorker.controller.postMessage({ type: 'setKey', key: encKey });
                        return;
                    }
                    return new Promise(function(resolve) {
                        navigator.serviceWorker.addEventListener('controllerchange', function() {
                            navigator.serviceWorker.controller.postMessage({ type: 'setKey', key: encKey });
                            resolve();
                        });
                        // If already active but not controlling, claim should fix it
                        if (sw && sw.state === 'activated') {
                            sw.postMessage({ type: 'setKey', key: encKey });
                            resolve();
                        }
                    });
                })
                .catch(function(err) {
                    console.error('Service Worker registration failed:', err);
                });
        }

        // HMAC-SHA256(key=secret, message=salt) → hex string
        function hmacHex(secret, salt) {
            var enc = new TextEncoder();
            return crypto.subtle.importKey(
                'raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
            ).then(function(hmacKey) {
                return crypto.subtle.sign('HMAC', hmacKey, enc.encode(salt));
            }).then(function(buf) {
                var arr = new Uint8Array(buf);
                return Array.from(arr, function(b) { return b.toString(16).padStart(2, '0'); }).join('');
            });
        }

        // HMAC-SHA256(key=secret, message=salt) → AES-256-GCM CryptoKey
        function hmacDeriveAesKey(secret, salt) {
            var enc = new TextEncoder();
            return crypto.subtle.importKey(
                'raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
            ).then(function(hmacKey) {
                return crypto.subtle.sign('HMAC', hmacKey, enc.encode(salt));
            }).then(function(derived) {
                return crypto.subtle.importKey(
                    'raw', derived, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
                );
            });
        }

        // Blob name / relay room: HMAC(key, "cool-blob") → hex
        function hashKey(key) {
            return hmacHex(key, 'cool-blob');
        }

        // Metadata encryption key: HMAC(key, "cool-meta") → AES key
        function deriveAesKey(keyStr) {
            return hmacDeriveAesKey(keyStr, 'cool-meta');
        }

        function encryptString(aesKey, plaintext) {
            var iv = crypto.getRandomValues(new Uint8Array(12));
            var data = new TextEncoder().encode(plaintext);
            return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, aesKey, data).then(function(ct) {
                // Return base64( iv + ciphertext )
                var out = new Uint8Array(iv.length + ct.byteLength);
                out.set(iv);
                out.set(new Uint8Array(ct), iv.length);
                return btoa(String.fromCharCode.apply(null, out));
            });
        }

        function decryptString(aesKey, b64) {
            var raw = Uint8Array.from(atob(b64), function(c) { return c.charCodeAt(0); });
            var iv = raw.slice(0, 12);
            var ct = raw.slice(12);
            return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, aesKey, ct).then(function(pt) {
                return new TextDecoder().decode(pt);
            });
        }

        // --- User name helpers ---

        // Generate a pronounceable nonsensical name
        function generateName() {
            var starts = ['Blo','Cri','Dra','Flu','Gri','Jum','Kla','Mox','Pli','Quo','Sna','Tri','Vex','Whi','Zep',
                          'Bri','Cha','Fro','Glu','Hix','Jol','Kru','Lum','Nib','Pra','Rix','Spo','Twa','Vul','Yak'];
            var mids = ['ndo','ber','sto','ple','mba','nki','fto','rgi','lta','nze',
                        'bbi','cci','dge','ffe','ggo','kka','llo','mmi','nno','ppo'];
            var ends = ['ax','en','is','or','us','ek','il','om','ur','az',
                        'ix','ot','un','ep','al','im','os','ub','er','an'];
            var s = starts[Math.floor(Math.random() * starts.length)];
            var m = mids[Math.floor(Math.random() * mids.length)];
            var e = ends[Math.floor(Math.random() * ends.length)];
            return s + m + e;
        }

        // Generate a unique name per browser (localStorage)
        var userName = localStorage.getItem('cool-username') || '';
        if (!userName) {
            userName = generateName();
            localStorage.setItem('cool-username', userName);
        }

        // Populate the name input — updates userName on change
        var nameInput = document.getElementById('name-input');
        nameInput.value = userName;
        nameInput.addEventListener('input', function() {
            userName = nameInput.value.trim() || userName;
            localStorage.setItem('cool-username', userName);
        });

        // --- URL / config helpers ---

        var configRelay = (window.__CONFIG__ && window.__CONFIG__.relayUrl) || '';
        var defaultRelay = configRelay || 'ws://localhost:9090';
        var params = new URLSearchParams(window.location.search);
        var relayServer = params.get('relayServer') || defaultRelay;

        function constructWopiUrl(filePath) {
            var localServer = window.location.protocol + "//" + window.location.host;
            var localUrl = localServer + "/cool.html?";
            var wopiSrc = filePath;
            return localUrl + "WOPISrc=" + encodeURIComponent(wopiSrc);
        }

        // Preload large WASM files, returns a promise. Calls onProgress(loaded, total).
        // Preload large WASM files into the Cache API so they persist across
        // page loads and can be served by the Service Worker to Emscripten.
        function preloadWasmFiles(onProgress) {
            var cdn = (window.__CONFIG__ && window.__CONFIG__.cdnUrl) || '';
            var cdnBase = cdn ? cdn.replace(/\/+$/, '') + '/' : '/';
            var files = ['online.wasm', 'soffice.data', 'online.js'];
            var CACHE_NAME = 'cool-wasm-assets';

            return caches.open(CACHE_NAME).then(function(cache) {
                // Check which files are already cached
                return Promise.all(files.map(function(file) {
                    return cache.match(cdnBase + file).then(function(resp) {
                        return { file: file, cached: !!resp, size: resp ? parseInt(resp.headers.get('Content-Length')) || 0 : 0 };
                    });
                })).then(function(results) {
                    var toDownload = [];
                    var totalSize = 0;
                    var alreadyCached = 0;
                    results.forEach(function(r) {
                        if (r.cached) {
                            console.log('preload: ' + r.file + ' already cached (' + r.size + ' bytes)');
                            alreadyCached += r.size;
                        } else {
                            toDownload.push(r.file);
                        }
                    });

                    if (toDownload.length === 0) {
                        console.log('preload: all files cached');
                        onProgress(1, 1);
                        return;
                    }

                    // HEAD requests for sizes of files we need to download
                    var sizes = {};
                    var loaded = {};
                    return Promise.all(toDownload.map(function(file) {
                        return fetch(cdnBase + file, { method: 'HEAD' }).then(function(resp) {
                            sizes[file] = parseInt(resp.headers.get('Content-Length')) || 0;
                            totalSize += sizes[file];
                            loaded[file] = 0;
                        }).catch(function() { sizes[file] = 0; loaded[file] = 0; });
                    })).then(function() {
                        totalSize += alreadyCached;
                        var currentLoaded = alreadyCached;

                        // Download missing files with progress via XHR, then store in Cache API
                        return Promise.all(toDownload.map(function(file) {
                            return new Promise(function(resolve) {
                                var xhr = new XMLHttpRequest();
                                xhr.open('GET', cdnBase + file);
                                xhr.responseType = 'arraybuffer';
                                xhr.onprogress = function(e) {
                                    loaded[file] = e.loaded;
                                    var sum = alreadyCached;
                                    for (var f in loaded) sum += loaded[f];
                                    onProgress(sum, totalSize);
                                };
                                xhr.onload = function() {
                                    loaded[file] = sizes[file];
                                    var sum = alreadyCached;
                                    for (var f in loaded) sum += loaded[f];
                                    onProgress(sum, totalSize);
                                    // Store in Cache API with correct content type
                                    var ct = file.endsWith('.wasm') ? 'application/wasm'
                                           : file.endsWith('.js') ? 'application/javascript'
                                           : 'application/octet-stream';
                                    var resp = new Response(xhr.response, {
                                        headers: {
                                            'Content-Type': ct,
                                            'Content-Length': xhr.response.byteLength.toString()
                                        }
                                    });
                                    cache.put(cdnBase + file, resp).then(resolve).catch(resolve);
                                };
                                xhr.onerror = function() { resolve(); };
                                xhr.send();
                            });
                        }));
                    });
                });
            });
        }

        // --- Open as Browser A (WASM host) ---

        function openAsHost(docId) {
            document.getElementById('upload-overlay').classList.add('hidden');
            var form = document.getElementById('form');
            form.style.display = '';
            form.action = constructWopiUrl(docId)
                + '&relay=' + encodeURIComponent(relayServer + '/host')
                + '&userName=' + encodeURIComponent(userName)
                + fragment;
            form.submit();
        }

        // --- Open as Browser B (thin client via relay) ---

        function openAsClient(docId) {
            document.getElementById('upload-overlay').classList.add('hidden');
            // Load relay-client.html in the iframe with the room = docId
            var clientUrl = '/relay-client.html'
                + '?relayServer=' + encodeURIComponent(relayServer)
                + '&relayRoom=' + encodeURIComponent(docId)
                + '&userName=' + encodeURIComponent(userName)
                + fragment;
            document.getElementById('coolframe').src = clientUrl;
        }

        // --- Try Browser B, fall back to Browser A ---

        function tryClientThenHost(docId, statusEl, onMustBeHost, onHostFound) {
            statusEl.textContent = 'Connecting to session...';
            var relayUrl = relayServer + '/client?room=' + encodeURIComponent(docId);
            var ws = new WebSocket(relayUrl);
            ws.binaryType = 'arraybuffer';
            var settled = false;

            ws.onopen = function() {
                // Connected to relay — but this doesn't mean a host is present.
                // If no host, the relay closes us with code 4000 almost immediately.
                // During grace period (host recently left), relay sends type=3.
                // Wait briefly: if still connected and no host-lost, host is present.
                setTimeout(function() {
                    if (settled) return;
                    settled = true;
                    ws.close();
                    statusEl.textContent = 'Host found — ready to join as collaborator.';
                    if (onHostFound) onHostFound();
                }, 500);
            };

            ws.onmessage = function(event) {
                // Check for control messages during probe (5+ bytes binary)
                if (event.data instanceof ArrayBuffer && event.data.byteLength >= 5) {
                    var ctrl = new Uint8Array(event.data);
                    if (ctrl[0] === 3) {
                        // type=3: you are the failover candidate — become host
                        if (settled) return;
                        settled = true;
                        ws.close();
                        statusEl.textContent = 'Host recently disconnected.';
                        onMustBeHost();
                    }
                    if (ctrl[0] === 5) {
                        // type=5: another client is taking over, wait for new host
                        if (settled) return;
                        settled = true;
                        ws.close();
                        var taker = event.data.byteLength > 5
                            ? new TextDecoder().decode(new Uint8Array(event.data).slice(5))
                            : 'Another collaborator';
                        statusEl.innerHTML = '<b>' + taker.replace(/</g, '&lt;') + '</b> is taking over as host...';
                        // Poll until new host is ready, then join as client
                        setTimeout(function() { tryClientThenHost(docId, statusEl, onMustBeHost); }, 3000);
                    }
                }
            };

            ws.onclose = function(ev) {
                if (settled) return;
                settled = true;
                statusEl.textContent = 'No active host found.';
                onMustBeHost();
            };

            ws.onerror = function() {
                if (settled) return;
                settled = true;
                statusEl.textContent = 'Relay unavailable.';
                onMustBeHost();
            };

            // Timeout after 5 seconds
            setTimeout(function() {
                if (settled) return;
                settled = true;
                try { ws.close(); } catch(e) {}
                statusEl.textContent = 'Connection timed out.';
                onMustBeHost();
            }, 5000);
        }

        // --- Failover message listeners ---
        // Listen for messages from iframe (cool.html or relay-client.html)

        window.addEventListener('message', function(event) {
            if (!event.data || !event.data.type) return;

            if (event.data.type === 'relay-host-rejected') {
                // Tried to be host but room already has one — switch to client
                console.log('wasm.html: host rejected (room has host), switching to client');
                hashKey(encKey).then(function(docId) {
                    openAsClient(docId);
                });
            }

            if (event.data.type === 'relay-host-lost') {
                // Host disconnected, you are the failover candidate — reload to become host
                console.log('wasm.html: host lost, reloading for failover');
                sessionStorage.setItem('failover', '1');
                window.location.reload();
            }

            if (event.data.type === 'relay-wait-for-host') {
                // Host disconnected but another client is taking over — show waiting overlay
                var takerName = event.data.name || 'Another collaborator';
                console.log('wasm.html: waiting for new host (' + takerName + ' is failing over)');
                var overlay = document.getElementById('upload-overlay');
                overlay.classList.remove('hidden');
                overlay.innerHTML =
                    '<h1>Collabora Online (WASM)</h1>' +
                    '<div class="status"><b>' + takerName.replace(/</g, '&lt;') + '</b> is taking over as host...</div>' +
                    '<div class="status" style="font-size:0.85em;color:#999;margin-top:0.5em;">You will be reconnected automatically.</div>';
            }

            if (event.data.type === 'relay-host-restored') {
                // New host is ready — reload as client to reconnect
                console.log('wasm.html: new host restored, reloading as client');
                sessionStorage.setItem('rejoin', '1');
                window.location.reload();
            }
        });

        // --- Show "Open" button before joining (lets user change name first) ---

        function showOpenButton(docId, originalName, role) {
            var status = document.getElementById('upload-status');
            if (originalName) {
                status.textContent = 'File ready: ' + originalName;
            } else {
                status.textContent = role === 'collaborator'
                    ? 'Host found — ready to join.'
                    : 'Ready to open as host.';
            }

            document.getElementById('init-progress').style.display = 'none';

            // Remove upload controls if present
            var fileLabel = document.querySelector('label[for="file-input"]');
            if (fileLabel) fileLabel.remove();
            var fileInput = document.getElementById('file-input');
            if (fileInput) fileInput.remove();

            var overlay = document.getElementById('upload-overlay');

            // Remove any existing links div (in case of re-render)
            var existing = overlay.querySelector('.links');
            if (existing) existing.remove();

            var linksDiv = document.createElement('div');
            linksDiv.className = 'links';

            var openBtn = document.createElement('a');
            openBtn.href = '#';
            openBtn.textContent = role === 'collaborator' ? 'Open as Collaborator' : 'Open as Host';
            openBtn.addEventListener('click', function(ev) {
                ev.preventDefault();
                if (role === 'collaborator') {
                    openAsClient(docId);
                } else {
                    openAsHost(docId);
                }
            });
            linksDiv.appendChild(openBtn);

            overlay.appendChild(linksDiv);
        }

        // --- Show ready UI (after upload or when returning to existing doc) ---

        function showReadyUI(docId, originalName) {
            var status = document.getElementById('upload-status');
            if (originalName) {
                status.textContent = 'File ready: ' + originalName;
            }

            var localServer = window.location.protocol + '//' + window.location.host;
            var shareUrl = localServer + '/wasm.html' + fragment;

            var overlay = document.getElementById('upload-overlay');

            // Remove upload controls if present
            var fileLabel = document.querySelector('label[for="file-input"]');
            if (fileLabel) fileLabel.remove();
            var fileInput = document.getElementById('file-input');
            if (fileInput) fileInput.remove();

            var linksDiv = document.createElement('div');
            linksDiv.className = 'links';

            // Share link
            var shareBox = document.createElement('div');
            shareBox.className = 'share-box';
            shareBox.innerHTML =
                '<label>Share this link with collaborators:</label>' +
                '<div class="share-row">' +
                    '<input type="text" id="share-url" value="' + shareUrl.replace(/"/g, '&quot;') + '" readonly />' +
                    '<button id="copy-btn">Copy</button>' +
                '</div>';
            linksDiv.appendChild(shareBox);

            // Open as Host button (disabled until preload completes)
            var hostLink = document.createElement('a');
            hostLink.href = '#';
            hostLink.id = 'host-link';
            hostLink.className = 'disabled';
            hostLink.textContent = 'Downloading WASM...';
            hostLink.addEventListener('click', function(ev) {
                ev.preventDefault();
                if (hostLink.classList.contains('disabled')) return;
                openAsHost(docId);
            });
            linksDiv.appendChild(hostLink);

            // Progress bar
            var progressBox = document.createElement('div');
            progressBox.className = 'progress-box';
            progressBox.innerHTML =
                '<div class="progress-bar"><div class="progress-bar-fill" id="preload-fill"></div></div>' +
                '<div class="progress-text" id="preload-text">Preparing...</div>';
            linksDiv.appendChild(progressBox);

            overlay.appendChild(linksDiv);

            document.getElementById('copy-btn').addEventListener('click', function() {
                navigator.clipboard.writeText(document.getElementById('share-url').value).then(function() {
                    document.getElementById('copy-btn').textContent = 'Copied!';
                    setTimeout(function() { document.getElementById('copy-btn').textContent = 'Copy'; }, 2000);
                });
            });

            // Wait for the early preload that started on page load
            if (_preloadDone) {
                hostLink.classList.remove('disabled');
                hostLink.textContent = 'Open as Host';
                var fill = document.getElementById('preload-fill');
                var text = document.getElementById('preload-text');
                if (fill) fill.style.width = '100%';
                if (text) text.textContent = 'Ready';
            } else {
                _preloadPromise.then(function() {
                    hostLink.classList.remove('disabled');
                    hostLink.textContent = 'Open as Host';
                    var fill = document.getElementById('preload-fill');
                    var text = document.getElementById('preload-text');
                    if (fill) fill.style.width = '100%';
                    if (text) text.textContent = 'Ready';
                });
            }
        }

        // --- Main flow ---

        // Start CDN preload immediately — runs in parallel with doc check / role detection
        var _preloadDone = false;
        var _preloadResolve;
        var _preloadPromise = new Promise(function(r) { _preloadResolve = r; });
        preloadWasmFiles(function(loaded, total) {
            var pct = Math.round((loaded / total) * 100);
            var mb = function(n) { return (n / 1048576).toFixed(1); };
            var fill = document.getElementById('preload-fill') || document.getElementById('init-fill');
            var text = document.getElementById('preload-text') || document.getElementById('init-text');
            if (fill) fill.style.width = pct + '%';
            if (text) text.textContent = mb(loaded) + ' / ' + mb(total) + ' MB (' + pct + '%)';
        }).then(function() {
            _preloadDone = true;
            _preloadResolve();
        });

        // If file_path or WOPISrc is already provided (direct open), skip everything
        if (params.get('file_path') || params.get('WOPISrc')) {
            document.getElementById('upload-overlay').classList.add('hidden');
            var form = document.getElementById("form");
            form.style.display = '';
            form.action = constructWopiUrl(params.get('WOPISrc') || params.get('file_path'));
            form.submit();
        } else if (params.get('viewerDocId')) {
            // Opened from viewer.html — document is already on the server at /wasm/<docId>
            var viewerDocId = params.get('viewerDocId');
            var viewerFileName = params.get('viewerFileName') || 'document';
            document.getElementById('upload-overlay').classList.add('hidden');
            document.title = viewerFileName + ' - Online';
            var form = document.getElementById("form");
            form.style.display = '';
            form.action = constructWopiUrl(viewerDocId);
            form.submit();
        } else if (!_hasHash && getRecentFiles().length > 0) {
            // No key in URL and we have recent files — show the file picker
            (function showRecentFilesUI() {
                var status = document.getElementById('upload-status');
                status.textContent = 'Choose a recent document or upload a new one.';
                document.getElementById('init-progress').style.display = 'none';

                var overlay = document.getElementById('upload-overlay');
                var recentDiv = document.createElement('div');
                recentDiv.className = 'recent-files';
                recentDiv.innerHTML = '<h2>Recent documents</h2><ul id="recent-list"></ul>';
                // Insert before the file input label
                var fileLabel = document.querySelector('label[for="file-input"]');
                overlay.insertBefore(recentDiv, fileLabel);

                // Add "or" divider before upload
                var orDiv = document.createElement('div');
                orDiv.className = 'or-divider';
                orDiv.textContent = '— or —';
                overlay.insertBefore(orDiv, fileLabel);

                function renderList() {
                    var ul = document.getElementById('recent-list');
                    ul.innerHTML = '';
                    var files = getRecentFiles();
                    if (files.length === 0) {
                        recentDiv.style.display = 'none';
                        orDiv.style.display = 'none';
                        return;
                    }
                    files.forEach(function(f) {
                        var li = document.createElement('li');
                        var nameSpan = document.createElement('span');
                        nameSpan.className = 'file-name';
                        nameSpan.textContent = f.name;
                        var dateSpan = document.createElement('span');
                        dateSpan.className = 'file-date';
                        dateSpan.textContent = new Date(f.time).toLocaleDateString();
                        var removeBtn = document.createElement('span');
                        removeBtn.className = 'file-remove';
                        removeBtn.textContent = '\u00d7';
                        removeBtn.title = 'Remove';
                        removeBtn.addEventListener('click', function(ev) {
                            ev.stopPropagation();
                            removeRecentFile(f.key);
                            renderList();
                        });
                        li.appendChild(nameSpan);
                        li.appendChild(dateSpan);
                        li.appendChild(removeBtn);
                        li.addEventListener('click', function() {
                            window.location.hash = '#' + f.key;
                            window.location.reload();
                        });
                        ul.appendChild(li);
                    });
                }
                renderList();

                // When user picks a new file, set the hash and start upload flow
                document.getElementById('file-input').addEventListener('change', function(e) {
                    var file = e.target.files[0];
                    if (!file) return;
                    // Set the generated key as the hash
                    window.location.hash = fragment;
                    encKey = fragment.substring(1);

                    // Register SW with the new key, then upload
                    var swSetup = Promise.resolve();
                    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                        navigator.serviceWorker.controller.postMessage({ type: 'setKey', key: encKey });
                    }

                    // Hide recent files, show upload progress
                    recentDiv.style.display = 'none';
                    orDiv.style.display = 'none';
                    fileLabel.style.display = 'none';

                    hashKey(encKey).then(function(docId) {
                        status.textContent = 'Uploading ' + file.name + '...';
                        swReady.then(function() {
                            var reader = new FileReader();
                            reader.onload = function(ev) {
                                var data = new Uint8Array(ev.target.result);
                                var uploadXhr = new XMLHttpRequest();
                                uploadXhr.open('POST', '/wasm/' + encodeURIComponent(docId));
                                uploadXhr.upload.onprogress = function(pe) {
                                    if (pe.lengthComputable) {
                                        var pct = Math.round((pe.loaded / pe.total) * 100);
                                        status.textContent = 'Uploading ' + file.name + '... ' + pct + '%';
                                    }
                                };
                                uploadXhr.onload = function() {
                                    if (uploadXhr.status !== 200) {
                                        status.textContent = 'Upload failed: ' + uploadXhr.status;
                                        return;
                                    }
                                    deriveAesKey(encKey).then(function(aesKey) {
                                        return encryptString(aesKey, file.name);
                                    }).then(function(encName) {
                                        var metaXhr2 = new XMLHttpRequest();
                                        metaXhr2.open('POST', '/wasm/meta/' + encodeURIComponent(docId));
                                        metaXhr2.setRequestHeader('Content-Type', 'application/json');
                                        metaXhr2.onload = function() {
                                            document.title = file.name + ' - Online';
                                            saveRecentFile(encKey, file.name);
                                            showReadyUI(docId, file.name);
                                        };
                                        metaXhr2.onerror = function() {
                                            document.title = file.name + ' - Online';
                                            saveRecentFile(encKey, file.name);
                                            showReadyUI(docId, file.name);
                                        };
                                        metaXhr2.send(JSON.stringify({ encryptedName: encName }));
                                    }).catch(function() {
                                        document.title = file.name + ' - Online';
                                        saveRecentFile(encKey, file.name);
                                        showReadyUI(docId, file.name);
                                    });
                                };
                                uploadXhr.onerror = function() {
                                    status.textContent = 'Upload failed: network error';
                                };
                                uploadXhr.send(data);
                            };
                            reader.readAsArrayBuffer(file);
                        });
                    });
                });
            })();
        } else {
            // Set the hash now for new documents (no recent files, or has hash)
            if (!_hasHash) window.location.hash = fragment;

            var initFill = document.getElementById('init-fill');
            var initText = document.getElementById('init-text');
            initFill.style.width = '20%';
            initText.textContent = 'Checking for existing document...';

            // Compute doc ID immediately (HMAC is fast), don't wait for SW
            hashKey(encKey).then(function(docId) {
                var status = document.getElementById('upload-status');
                initFill.style.width = '50%';

                // Check if a document already exists for this key
                var xhr = new XMLHttpRequest();
                xhr.open('HEAD', '/wasm/' + encodeURIComponent(docId));
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        // Document exists — try to join as Browser B, else become Host
                        status.textContent = 'Found existing document...';

                        // Try to decrypt the original filename from metadata
                        var metaXhr = new XMLHttpRequest();
                        metaXhr.open('GET', '/wasm/meta/' + encodeURIComponent(docId));
                        metaXhr.onload = function() {
                            var originalName = null;
                            if (metaXhr.status === 200) {
                                try {
                                    var meta = JSON.parse(metaXhr.responseText);
                                    if (meta.encryptedName) {
                                        deriveAesKey(encKey).then(function(aesKey) {
                                            return decryptString(aesKey, meta.encryptedName);
                                        }).then(function(name) {
                                            document.title = name + ' - Online';
                                            startAutoRole(docId, name);
                                        }).catch(function() {
                                            startAutoRole(docId, null);
                                        });
                                        return;
                                    }
                                } catch(e) {}
                            }
                            startAutoRole(docId, null);
                        };
                        metaXhr.onerror = function() {
                            startAutoRole(docId, null);
                        };
                        metaXhr.send();

                        function startAutoRole(docId, originalName) {
                            // Remember this file for the recent files list
                            if (originalName) saveRecentFile(encKey, originalName);
                            document.getElementById('init-progress').style.display = 'none';
                            // Check if this is a failover reload — auto-open as host
                            var isFailover = sessionStorage.getItem('failover') === '1';
                            if (isFailover) {
                                sessionStorage.removeItem('failover');
                            }
                            // Check if this is a rejoin after host-restored — auto-open as client
                            var isRejoin = sessionStorage.getItem('rejoin') === '1';
                            if (isRejoin) {
                                sessionStorage.removeItem('rejoin');
                            }
                            tryClientThenHost(docId, status, function() {
                                if (isFailover) {
                                    // Failover: skip UI, open as host immediately
                                    status.textContent = 'Taking over as host...';
                                    openAsHost(docId);
                                    return;
                                }
                                // Normal: show ready UI with download + host button
                                showReadyUI(docId, originalName);
                            }, function() {
                                if (isRejoin || isFailover) {
                                    // Auto-rejoin after failover — open immediately
                                    openAsClient(docId);
                                    return;
                                }
                                // Normal: show "Open" button so user can change name first
                                showOpenButton(docId, originalName, 'collaborator');
                            });
                        }
                    } else {
                        // No document — show upload form
                        showUploadForm(docId);
                    }
                };
                xhr.onerror = function() {
                    showUploadForm(docId);
                };
                xhr.send();

                function showUploadForm(docId) {
                    status.textContent = 'No document found for this link. Please upload a file to get started.';
                    // Show CDN preload progress while user picks a file
                    if (_preloadDone) {
                        document.getElementById('init-progress').style.display = 'none';
                    } else {
                        document.getElementById('init-text').textContent = 'Downloading WASM...';
                        _preloadPromise.then(function() {
                            document.getElementById('init-progress').style.display = 'none';
                        });
                    }
                    document.getElementById('file-input').addEventListener('change', function(e) {
                        var file = e.target.files[0];
                        if (!file) return;

                        status.textContent = 'Preparing upload...';
                        // Ensure Service Worker is ready before uploading (it encrypts the POST)
                        swReady.then(function() {
                        status.textContent = 'Uploading ' + file.name + '...';
                        console.log('Upload started:', file.name, file.size, 'bytes');

                        var reader = new FileReader();
                        reader.onload = function(ev) {
                            var data = new Uint8Array(ev.target.result);
                            console.log('File read complete:', data.length, 'bytes. POSTing to /wasm/' + docId);

                            // Upload file to blob storage using docId as blob name
                            var uploadXhr = new XMLHttpRequest();
                            uploadXhr.open('POST', '/wasm/' + encodeURIComponent(docId));
                            uploadXhr.upload.onprogress = function(pe) {
                                if (pe.lengthComputable) {
                                    var pct = Math.round((pe.loaded / pe.total) * 100);
                                    status.textContent = 'Uploading ' + file.name + '... ' + pct + '%';
                                }
                            };
                            uploadXhr.onload = function() {
                                console.log('Upload response:', uploadXhr.status, uploadXhr.statusText);
                                if (uploadXhr.status !== 200) {
                                    status.textContent = 'Upload failed: ' + uploadXhr.status + ' ' + uploadXhr.statusText;
                                    return;
                                }
                                status.textContent = 'Upload complete. Saving metadata...';
                                // Store encrypted filename as metadata
                                deriveAesKey(encKey).then(function(aesKey) {
                                    return encryptString(aesKey, file.name);
                                }).then(function(encName) {
                                    var metaXhr2 = new XMLHttpRequest();
                                    metaXhr2.open('POST', '/wasm/meta/' + encodeURIComponent(docId));
                                    metaXhr2.setRequestHeader('Content-Type', 'application/json');
                                    metaXhr2.onload = function() {
                                        console.log('Metadata saved');
                                        document.title = file.name + ' - Online';
                                        saveRecentFile(encKey, file.name);
                                        showReadyUI(docId, file.name);
                                    };
                                    metaXhr2.onerror = function() {
                                        console.warn('Metadata save failed, continuing anyway');
                                        document.title = file.name + ' - Online';
                                        saveRecentFile(encKey, file.name);
                                        showReadyUI(docId, file.name);
                                    };
                                    metaXhr2.send(JSON.stringify({ encryptedName: encName }));
                                }).catch(function(err) {
                                    console.warn('Failed to encrypt metadata:', err);
                                    document.title = file.name + ' - Online';
                                    showReadyUI(docId, file.name);
                                });
                            };
                            uploadXhr.onerror = function() {
                                console.error('Upload XHR error');
                                status.textContent = 'Upload failed: network error';
                            };
                            uploadXhr.ontimeout = function() {
                                console.error('Upload timed out');
                                status.textContent = 'Upload timed out';
                            };
                            uploadXhr.send(data);
                        };
                        reader.onerror = function() {
                            status.textContent = 'Failed to read file';
                        };
                        reader.readAsArrayBuffer(file);
                        }); // end swReady.then
                    });
                }
            });
        }
    </script>
</body>

</html>
