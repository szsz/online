<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
    <title>Online</title>
    <style>
        html,
        body,
        iframe {
            margin: 0px;
            padding: 0px;
            border: none;
        }
        #upload-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            z-index: 10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #upload-overlay.hidden { display: none; }
        #upload-overlay h1 { font-size: 1.5em; margin-bottom: 1em; color: #333; }
        #upload-overlay label {
            display: inline-block;
            padding: 12px 24px;
            background: #0366d6;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
        }
        #upload-overlay label:hover { background: #0256b9; }
        #upload-overlay input[type="file"] { display: none; }
        #upload-overlay .status { margin-top: 1em; color: #666; }
        #upload-overlay .links { margin-top: 1.5em; text-align: center; width: 100%; max-width: 500px; }
        #upload-overlay .links a {
            display: block;
            margin: 0.5em 0;
            padding: 12px 24px;
            background: #0366d6;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 1em;
        }
        #upload-overlay .links a:hover { background: #0256b9; }
        #upload-overlay .share-box { margin-top: 1em; width: 100%; }
        #upload-overlay .share-box label { display: block; margin-bottom: 0.4em; color: #555; font-size: 0.9em; background: none; padding: 0; cursor: default; }
        #upload-overlay .share-row { display: flex; gap: 0; }
        #upload-overlay .share-row input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px 0 0 6px;
            font-size: 0.85em;
            font-family: monospace;
            outline: none;
        }
        #upload-overlay .share-row input[type="text"]:focus { border-color: #0366d6; }
        #upload-overlay .share-row button {
            padding: 10px 16px;
            background: #28a745;
            color: white;
            border: 1px solid #28a745;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            font-size: 0.85em;
            white-space: nowrap;
        }
        #upload-overlay .share-row button:hover { background: #22863a; }
    </style>
    <script src="/config.js"></script>
</head>

<body>
    <div id="upload-overlay">
        <h1>Collabora Online (WASM)</h1>
        <label for="file-input">Choose a document to open</label>
        <input type="file" id="file-input"
            accept=".odt,.ods,.odp,.odg,.docx,.xlsx,.pptx,.doc,.xls,.ppt,.pdf,.txt,.csv,.rtf" />
        <div class="status" id="upload-status"></div>
    </div>
    <form id="form" action enctype="multipart/form-data" target="coolframe" method="post" style="display:none;">
        <input name="access_token" value="test" type="hidden" />
    </form>
    <iframe id="coolframe" name="coolframe" style="width:100%;height:100%;position:absolute;" title="Collabora Online">
    </iframe>
    <script>
        function constructWopiUrl(filePath) {
            var localServer = window.location.protocol + "//" + window.location.host;
            var localUrl = localServer + window.location.pathname + "?";
            localUrl = localUrl.replace("/wasm.html", "/cool.html");
            var params = new URLSearchParams(window.location.search);
            var wopiSrc = params.get('WOPISrc');
            if (wopiSrc) {
                params.delete('WOPISrc');
            }
            else {
                if (!filePath) {
                    filePath = params.get('file_path');
                }
                if (filePath) {
                    filePath = filePath.replace(/^\//, '');
                }
                params.delete('file_path');
                wopiSrc = localServer + "/wopi/files/" + filePath;
            }
            return localUrl + params.toString() + (params.size === 0 ? '' : '&') + "WOPISrc="
                + encodeURIComponent(wopiSrc);
        }

        var params = new URLSearchParams(window.location.search);

        // If file_path or WOPISrc is already provided, skip upload dialog
        if (params.get('file_path') || params.get('WOPISrc')) {
            document.getElementById('upload-overlay').classList.add('hidden');
            var form = document.getElementById("form");
            form.style.display = '';
            form.action = constructWopiUrl();
            form.submit();
        } else {
            // Show upload dialog
            document.getElementById('file-input').addEventListener('change', function(e) {
                var file = e.target.files[0];
                if (!file) return;

                var status = document.getElementById('upload-status');
                status.textContent = 'Loading ' + file.name + '...';

                var reader = new FileReader();
                reader.onload = function(ev) {
                    // If a room name is specified, rename the file to <room>.<ext>
                    // so the Emscripten FS path matches the relay room name.
                    var uploadName = file.name;
                    var room = params.get('room');
                    if (room) {
                        var ext = file.name.substring(file.name.lastIndexOf('.'));
                        uploadName = room + ext;
                    }

                    // Store the file data globally so the Emscripten module's preRun
                    // can write it into the virtual filesystem before main() runs
                    window._uploadedFileData = new Uint8Array(ev.target.result);
                    window._uploadedFileName = uploadName;

                    // Build the relay room name (sanitized upload path)
                    var safeName = uploadName.replace(/[^a-zA-Z0-9._-]/g, '_');
                    var relayRoom = 'upload/' + safeName;
                    var configRelay = (window.__CONFIG__ && window.__CONFIG__.relayUrl) || '';
                    var defaultRelay = configRelay || 'ws://localhost:9090';
                    var relayServer = params.get('relayServer') || defaultRelay;

                    // Build Browser B URL: relay-client.html with room name + encryption fragment
                    var localServer = window.location.protocol + '//' + window.location.host;
                    var fragment = window.location.hash || '';
                    var browserBUrl = localServer + '/relay-client.html'
                        + '?relayServer=' + encodeURIComponent(relayServer)
                        + '&relayRoom=' + encodeURIComponent(relayRoom)
                        + fragment;

                    // Show open button + share link
                    status.textContent = 'File ready: ' + file.name;
                    var linksDiv = document.createElement('div');
                    linksDiv.className = 'links';

                    var hostLink = document.createElement('a');
                    hostLink.href = '#';
                    hostLink.textContent = 'Open as Host';
                    hostLink.addEventListener('click', function(ev) {
                        ev.preventDefault();
                        document.getElementById('upload-overlay').classList.add('hidden');
                        var form = document.getElementById('form');
                        form.style.display = '';
                        form.action = constructWopiUrl('upload/' + safeName)
                            + '&relay=' + encodeURIComponent(relayServer + '/host')
                            + fragment;
                        form.submit();
                    });
                    linksDiv.appendChild(hostLink);

                    var shareBox = document.createElement('div');
                    shareBox.className = 'share-box';
                    shareBox.innerHTML =
                        '<label>Share this link with collaborators:</label>' +
                        '<div class="share-row">' +
                            '<input type="text" id="share-url" value="' + browserBUrl.replace(/"/g, '&quot;') + '" readonly />' +
                            '<button id="copy-btn">Copy</button>' +
                        '</div>';
                    linksDiv.appendChild(shareBox);

                    document.getElementById('upload-overlay').appendChild(linksDiv);

                    document.getElementById('copy-btn').addEventListener('click', function() {
                        var input = document.getElementById('share-url');
                        navigator.clipboard.writeText(input.value).then(function() {
                            document.getElementById('copy-btn').textContent = 'Copied!';
                            setTimeout(function() { document.getElementById('copy-btn').textContent = 'Copy'; }, 2000);
                        });
                    });
                };
                reader.readAsArrayBuffer(file);
            });
        }
    </script>
</body>

</html>
